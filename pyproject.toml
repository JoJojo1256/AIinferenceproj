[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specdec"
version = "0.1.0"
description = "A correctness-first implementation and performance study of speculative decoding."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate==1.8.1",
    "huggingface-hub==0.33.2",
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "safetensors==0.5.3",
    "torch==2.7.1",
    "transformers==4.53.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
